es</text><path d="M25 189H615" stroke="#2e3e4b"/><rect x="32" y="255" width="13" height="36" rx="3" fill="#e4b779" stroke="#e4b779"/><rect x="51" y="255" width="13" height="36" rx="3" fill="#13212b" stroke="#354654"/><rect x="70" y="255" width="13" height="36" rx="3" fill="#13212b" stroke="#354654"/><path d="M97 272 120 272" class="line" style="stroke:#83a9bc"/><rect x="132" y="246" width="66" height="81" rx="8" fill="#101d27" stroke="#304655"/><use href="#person" transform="translate(165 281) scale(0.4)" fill="#e4b779"/><text x="115" y="363" text-anchor="middle" class="small">Light 1 → basis 1</text><rect x="238" y="255" width="13" height="36" rx="3" fill="#13212b" stroke="#354654"/><rect x="257" y="255" width="13" height="36" rx="3" fill="#82c4bd" stroke="#82c4bd"/><rect x="276" y="255" width="13" height="36" rx="3" fill="#13212b" stroke="#354654"/><path d="M303 272 326 272" class="line" style="stroke:#83a9bc"/><rect x="338" y="246" width="66" height="81" rx="8" fill="#101d27" stroke="#304655"/><use href="#person" transform="translate(371 281) scale(0.4)" fill="#82c4bd"/><text x="321" y="363" text-anchor="middle" class="small">Light 2 → basis 2</text><rect x="444" y="255" width="13" height="36" rx="3" fill="#13212b" stroke="#354654"/><rect x="463" y="255" width="13" height="36" rx="3" fill="#13212b" stroke="#354654"/><rect x="482" y="255" width="13" height="36" rx="3" fill="#8daeda" stroke="#8daeda"/><path d="M509 272 532 272" class="line" style="stroke:#83a9bc"/><rect x="544" y="246" width="66" height="81" rx="8" fill="#101d27" stroke="#304655"/><use href="#person" transform="translate(577 281) scale(0.4)" fill="#8daeda"/><text x="527" y="363" text-anchor="middle" class="small">Light 3 → basis 3</text></svg>