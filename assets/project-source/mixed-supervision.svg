<svg xmlns="http://www.w3.org/2000/svg" width="640" height="504" viewBox="0 0 640 504" role="img" aria-labelledby="title desc">
<title id="title">One flat-lit input, three two-light mixtures</title>
<desc id="desc">A flat-lit human is the shared input to Generation. Three environment maps each combine warm light from the left and teal light from the right, weighted 0.8/0.2, 0.2/0.8, and 0.5/0.5. Each generated-image illustration uses the corresponding linear-RGB blend of two directional gradients. No cast shadows are drawn.</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 10 5 0 10" fill="#83a9bc"/></marker>
  <linearGradient id="warm" gradientUnits="userSpaceOnUse" x1="-44" y1="0" x2="44" y2="0"><stop stop-color="#edc37a"/><stop offset=".45" stop-color="#b59461"/><stop offset="1" stop-color="#273342"/></linearGradient>
  <linearGradient id="teal" gradientUnits="userSpaceOnUse" x1="-44" y1="0" x2="44" y2="0"><stop stop-color="#233142"/><stop offset=".55" stop-color="#4d8a84"/><stop offset="1" stop-color="#82c4bd"/></linearGradient>
  <linearGradient id="top" gradientUnits="userSpaceOnUse" x1="0" y1="-75" x2="0" y2="94"><stop stop-color="#a9c5ee"/><stop offset=".3" stop-color="#6a88b0"/><stop offset=".58" stop-color="#364c6c"/><stop offset="1" stop-color="#182330"/></linearGradient>
  <linearGradient id="envWarm"><stop stop-color="#b99c63"/><stop offset=".38" stop-color="#445267"/><stop offset="1" stop-color="#1c344b"/></linearGradient>
  <linearGradient id="envTeal"><stop stop-color="#1a3545"/><stop offset=".55" stop-color="#274658"/><stop offset="1" stop-color="#83aaa3"/></linearGradient>
  <linearGradient id="envBlue" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a2bad9"/><stop offset=".4" stop-color="#3b526b"/><stop offset="1" stop-color="#162533"/></linearGradient>
  <g id="pose1"><circle cy="-55" r="17"/><path d="M-17-32 Q0-41 17-32 L37 17 25 23 13-1 19 43 14 92 1 92 0 46-1 92-14 92-19 43-13-1-25 23-37 17Z"/></g>
  <g id="pose2"><circle cx="4" cy="-55" r="17"/><path d="M-13-32 Q4-41 21-32 L43-2 35 8 14-12 17 33 35 81 23 87 0 43-21 87-33 81-13 29-12-5-33 27-43 20Z"/></g>
  <g id="pose3"><circle cy="-55" r="17"/><path d="M-17-32 -37-58 -45-82 -56-78 -49-46 -28-8 -17 8 -19 43 -26 91 -12 94 0 48 12 94 26 91 19 43 17 8 28-8 49-46 56-78 45-82 37-58 17-32 Q0-41 -17-32Z"/></g>
</defs>

