<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
<title>Light transport through a person</title><desc>Conceptual light paths for reflection, subsurface scattering, and self-occlusion; not measured paths.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#83a9bc"/></marker>
<linearGradient id="warm"><stop stop-color="#edc37a"/><stop offset="1" stop-color="#31404c"/></linearGradient>
<linearGradient id="cool"><stop stop-color="#263947"/><stop offset="1" stop-color="#84bfdf"/></linearGradient>
<linearGradient id="mix"><stop stop-color="#e9c88e"/><stop offset=".5" stop-color="#669b9b"/><stop offset="1" stop-color="#739bb9"/></linearGradient>
<g id="person"><circle cy="-55" r="17"/><path d="M-17-32 Q0-41 17-32 L37 17 25 23 13-1 19 43 14 92 1 92 0 46-1 92-14 92-19 43-13-1-25 23-37 17Z"/></g>
<g id="walk"><circle cx="4" cy="-55" r="17"/><path d="M-13-32 Q4-41 21-32 L43-2 35 8 14-12 17 33 35 81 23 87 0 43-21 87-33 81-13 29-12-5-33 27-43 20Z"/></g>
</defs>
<rect width="640" height="400" rx="12" fill="#080e13"/>
<style>text{font-family:Arial,sans-serif;fill:#dbe7ef;font-size:22px} .muted{fill:#91a9bb} .small{font-size:19px} .label{font-size:24px;font-weight:600} .line{fill:none;stroke:#83a9bc;stroke-width:2.5;marker-end:url(#arrow)} .dash{stroke-dasharray:6 5}</style>
<text x="28" y="36" text-anchor="start" class="label">Light paths shape appearance</text><ellipse cx="320" cy="320" rx="92" ry="14" fill="#13212b"/><use href="#person" transform="translate(320 214) scale(1.1)" fill="#516a7e"/><circle cx="82" cy="115" r="15" fill="#e9c178"/><circle cx="480" cy="82" r="13" fill="#83c7bc"/><text x="31" y="83" text-anchor="start" class="small">Light A</text><text x="439" y="52" text-anchor="start" class="small">Light B</text><rect x="514" y="248" width="84" height="55" rx="8" fill="#101d27" stroke="#304655"/><text x="556" y="283" text-anchor="middle" class="small">View</text><path d="M96 119 301 154 512 268" class="line" style="stroke:#e9c178"/><path d="M469 94 336 166 Q298 185 337 215 L513 278" class="line" style="stroke:#83c7bc"/><path d="M101 126 284 237" class="line" style="stroke:#b18cb8"/><path d="m276 229 16 16m0-16-16 16" stroke="#c093b6" stroke-width="3"/><path d="M287 238 351 278" class="line dash" style="stroke:#c093b6"/><text x="118" y="145" text-anchor="start" class="small" style="fill:#e9c178">Reflection</text><text x="370" y="214" text-anchor="start" class="small" style="fill:#83c7bc">Scattering</text><text x="44" y="258" text-anchor="start" class="small" style="fill:#c093b6">Self-occlusion</text><text x="320" y="368" text-anchor="middle" class="">Geometry + materials + visibility</text></svg>