<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
<title>Linear composition of OLAT images</title><desc>Three illustrative directional responses are weighted 0.6, 0.3, and 0.1 and added. These are conceptual shapes, not model results.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#83a9bc"/></marker>
<linearGradient id="warm"><stop stop-color="#edc37a"/><stop offset="1" stop-color="#31404c"/></linearGradient>
<linearGradient id="cool"><stop stop-color="#263947"/><stop offset="1" stop-color="#84bfdf"/></linearGradient>
<linearGradient id="mix"><stop stop-color="#e9c88e"/><stop offset=".5" stop-color="#669b9b"/><stop offset="1" stop-color="#739bb9"/></linearGradient>
<g id="person"><circle cy="-55" r="17"/><path d="M-17-32 Q0-41 17-32 L37 17 25 23 13-1 19 43 14 92 1 92 0 46-1 92-14 92-19 43-13-1-25 23-37 17Z"/></g>
<g id="walk"><circle cx="4" cy="-55" r="17"/><path d="M-13-32 Q4-41 21-32 L43-2 35 8 14-12 17 33 35 81 23 87 0 43-21 87-33 81-13 29-12-5-33 27-43 20Z"/></g>
</defs>
<rect width="640" height="400" rx="12" fill="#080e13"/>
<style>text{font-family:Arial,sans-serif;fill:#dbe7ef;font-size:22px} .muted{fill:#91a9bb} .small{font-size:19px} .label{font-size:24px;font-weight:600} .line{fill:none;stroke:#83a9bc;stroke-width:2.5;marker-end:url(#arrow)} .dash{stroke-dasharray:6 5}</style>
<text x="25" y="36" text-anchor="start" class="label">Directional bases → a new environment</text><rect x="38" y="74" width="150" height="174" rx="8" fill="#101d27" stroke="#304655"/><use href="#person" transform="translate(113 146) scale(0.85)" fill="url(#warm)"/><circle cx="62" cy="100" r="7" fill="#e4b779"/><text x="113" y="275" text-anchor="middle" class="">0.6 × B₁</text><text x="215" y="165" text-anchor="middle" class="label">+</text><rect x="243" y="74" width="150" height="174" rx="8" fill="#101d27" stroke="#304655"/><use href="#person" transform="translate(318 146) scale(0.85)" fill="url(#cool)"/><circle cx="369" cy="100" r="7" fill="#82c4bd"/><text x="318" y="275" text-anchor="middle" class="">0.3 × B₂</text><text x="420" y="165" text-anchor="middle" class="label">+</text><rect x="448" y="74" width="150" height="174" rx="8" fill="#101d27" stroke="#304655"/><use href="#person" transform="translate(523 146) scale(0.85)" fill="#7dbbb2"/><circle cx="523" cy="87" r="7" fill="#8daeda"/><text x="523" y="275" text-anchor="middle" class="">0.1 × B₃</text><path d="M320 289 320 319" class="line" style="stroke:#83a9bc"/><rect x="112" y="332" width="416" height="48" rx="8" fill="#122029" stroke="#3c645f"/><text x="320" y="364" text-anchor="middle" class="">Weighted sum in linear color</text></svg>