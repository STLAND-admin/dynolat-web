<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
<title>Static sweeps and dynamic paired capture</title><desc>A static sweep repeats one pose under changing lights. Dynamic frames interleave flat-lit and OLAT captures while poses change, followed by alignment.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#83a9bc"/></marker>
<linearGradient id="warm"><stop stop-color="#edc37a"/><stop offset="1" stop-color="#31404c"/></linearGradient>
<linearGradient id="cool"><stop stop-color="#263947"/><stop offset="1" stop-color="#84bfdf"/></linearGradient>
<linearGradient id="mix"><stop stop-color="#e9c88e"/><stop offset=".5" stop-color="#669b9b"/><stop offset="1" stop-color="#739bb9"/></linearGradient>
<g id="person"><circle cy="-55" r="17"/><path d="M-17-32 Q0-41 17-32 L37 17 25 23 13-1 19 43 14 92 1 92 0 46-1 92-14 92-19 43-13-1-25 23-37 17Z"/></g>
<g id="walk"><circle cx="4" cy="-55" r="17"/><path d="M-13-32 Q4-41 21-32 L43-2 35 8 14-12 17 33 35 81 23 87 0 43-21 87-33 81-13 29-12-5-33 27-43 20Z"/></g>
</defs>
<rect width="640" height="400" rx="12" fill="#080e13"/>
<style>text{font-family:Arial,sans-serif;fill:#dbe7ef;font-size:22px} .muted{fill:#91a9bb} .small{font-size:19px} .label{font-size:24px;font-weight:600} .line{fill:none;stroke:#83a9bc;stroke-width:2.5;marker-end:url(#arrow)} .dash{stroke-dasharray:6 5}</style>
<text x="25" y="33" text-anchor="start" class="label">Static sweep: hold the pose</text><rect x="63" y="51" width="103" height="96" rx="8" fill="#101d27" stroke="#304655"/><use href="#person" transform="translate(114 91) scale(0.48)" fill="#e4b779"/><text x="114" y="171" text-anchor="middle" class="small">OLAT 1</text><rect x="269" y="51" width="103" height="96" rx="8" fill="#101d27" stroke="#304655"/><use href="#person" transform="translate(320 91) scale(0.48)" fill="#82c4bd"/><text x="320" y="171" text-anchor="middle" class="small">OLAT 2</text><rect x="475" y="51" width="103" height="96" rx="8" fill="#101d27" stroke="#304655"/><use href="#person" transform="translate(526 91) scale(0.48)" fill="#8daeda"/><text x="526" y="171" text-anchor="middle" class="small">OLAT 3</text><path d="M25 190H615" stroke="#2e3e4b"/><text x="25" y="223" text-anchor="start" class="label">Dynamic capture: interleave and align</text><rect x="27" y="241" width="98" height="90" rx="8" fill="#101d27" stroke="#304655"/><use href="#person" transform="translate(76 278) scale(0.43)" fill="#c4d4df"/><text x="76" y="355" text-anchor="middle" class="small">Flat</text><rect x="149" y="241" width="98" height="90" rx="8" fill="#101d27" stroke="#304655"/><use href="#walk" transform="translate(198 278) scale(0.43)" fill="#e4b779"/><text x="198" y="355" text-anchor="middle" class="small">OLAT</text><rect x="271" y="241" width="98" height="90" rx="8" fill="#101d27" stroke="#304655"/><use href="#walk" transform="translate(320 278) scale(0.43)" fill="#c4d4df"/><text x="320" y="355" text-anchor="middle" class="small">Flat</text><rect x="393" y="241" width="98" height="90" rx="8" fill="#101d27" stroke="#304655"/><use href="#person" transform="translate(442 278) scale(0.43)" fill="#82c4bd"/><text x="442" y="355" text-anchor="middle" class="small">OLAT</text><rect x="515" y="241" width="98" height="90" rx="8" fill="#101d27" stroke="#304655"/><use href="#walk" transform="translate(564 278) scale(0.43)" fill="#c4d4df"/><text x="564" y="355" text-anchor="middle" class="small">Flat</text><path d="M200 365 262 382" class="line" style="stroke:#83a9bc"/><path d="M439 365 377 382" class="line" style="stroke:#83a9bc"/><text x="320" y="391" text-anchor="middle" class="small">Aligned pairs</text></svg>