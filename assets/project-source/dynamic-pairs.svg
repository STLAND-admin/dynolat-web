<ellipse cx="164" cy="334" rx="17" ry="3" fill="#060b12"/>
<g transform="translate(164 293) scale(0.41)"><use href="#pose1" fill="url(#warm)"/></g>
<text x="164" y="365" class="small" text-anchor="middle">OLAT</text>
<path d="M27 373 V378 H203 V373" stroke="#52788b" fill="none"/>
<text x="115" y="396" class="small muted" text-anchor="middle">Pair 1</text>
<rect x="228" y="254" width="88" height="89" rx="8" fill="#101d27" stroke="#304655"/>
<ellipse cx="272" cy="334" rx="17" ry="3" fill="#060b12"/>
<g transform="translate(272 293) scale(0.41)"><use href="#pose2" fill="#c5d1da"/></g>
<text x="272" y="365" class="small" text-anchor="middle">Flat</text>
<rect x="326" y="254" width="88" height="89" rx="8" fill="#101d27" stroke="#304655"/>
<ellipse cx="370" cy="334" rx="17" ry="3" fill="#060b12"/>
<g transform="translate(370 293) scale(0.41)"><use href="#pose2" fill="url(#teal)"/></g>
<text x="370" y="365" class="small" text-anchor="middle">OLAT</text>
<path d="M233 373 V378 H409 V373" stroke="#52788b" fill="none"/>
<text x="321" y="396" class="small muted" text-anchor="middle">Pair 2</text>
<rect x="434" y="254" width="88" height="89" rx="8" fill="#101d27" stroke="#304655"/>
<ellipse cx="478" cy="334" rx="17" ry="3" fill="#060b12"/>
<g transform="translate(478 293) scale(0.41)"><use href="#pose3" fill="#c5d1da"/></g>
<text x="478" y="365" class="small" text-anchor="middle">Flat</text>
<rect x="532" y="254" width="88" height="89" rx="8" fill="#101d27" stroke="#304655"/>
<ellipse cx="576" cy="334" rx="17" ry="3" fill="#060b12"/>
<g transform="translate(576 293) scale(0.41)"><use href="#pose3" fill="url(#top)"/><ellipse cx="0" cy="-31" rx="10" ry="4" fill="#101927" opacity=".8"/></g>
<text x="576" y="365" class="small" text-anchor="middle">OLAT</text>
<path d="M439 373 V378 H615 V373" stroke="#52788b" fill="none"/>
<text x="527" y="396" class="small muted" text-anchor="middle">Pair 3</text>
</svg>
